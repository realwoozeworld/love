<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>სიურპრიზი ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      position: relative;
    }
    h1 {
      color: #ff4b2b;
      font-size: 2rem;
      margin-bottom: 15px;
    }
    p {
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 50px;
    }
    button {
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .yes-btn {
      background: #ff4b2b;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
    }
    .yes-btn:hover {
      transform: scale(1.1);
      background: #ff2a00;
    }
    .no-btn {
      background: #e0e0e0;
      color: #333;
      position: absolute;
      right: 30px;
    }
    .success-message {
      display: none;
    }
    .hearts {
      font-size: 3rem;
      margin-top: 15px;
      animation: beat 0.8s infinite alternate;
    }
    @keyframes beat {
      to { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div id="quiz">
      <h1>თამარ ❤️</h1>
      <p>იცოდი, რომ მსოფლიოში ყველაზე მეტად მიყვარხარ?</p>
      <div class="btn-container">
        <button class="yes-btn" onclick="showLove()">კი, ვიცი! 🥰</button>
        <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">არა 😜</button>
      </div>
    </div>

    <div class="success-message" id="success">
      <h1>მეც ძალიან, ძალიან მიყვარხარ! 💖</h1>
      <p>შენ ჩემი ცხოვრების ყველაზე ლამაზი ნაწილი ხარ ✨</p>
      <div class="hearts">❤️💖💕</div>
    </div>
  </div>

  <script>
    function moveButton() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40);
      
      btn.style.position = 'fixed';
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    function showLove() {
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    }
  </script>
</body>
</html>
